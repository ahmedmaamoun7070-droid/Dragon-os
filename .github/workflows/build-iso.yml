
name: Build DRAGON OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Configure DRAGON OS
        run: |
          mkdir -p config/package-lists
          cat > config/package-lists/dragon.list.chroot <<'EOF'
          live-boot
          live-config
          task-xfce-desktop
          xfce4
          lightdm
          network-manager
          firefox-esr
          thunar
          mousepad
          htop
          gparted
          sudo
          locales
          EOF
          sudo lb config \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootappend-live "boot=live components username=dragon hostname=dragon-os locales=en_US.UTF-8"

      - name: Build bootable ISO
        run: sudo lb build

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRAGON-OS-ISO
          path: "*.iso"
          if-no-files-found: error
